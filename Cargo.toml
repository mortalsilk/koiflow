[package]
name = "koiflow"
version = "0.1.0"
edition = "2024"
description = "A calm, high-performance document reader with semantic text reflow"
license = "MIT"

[lib]
doctest = false

[dependencies]
directories = "6.0"
dejavu = "2.37"
ebook-rs = { version = "0.16.6", default-features = false }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui_extras = { version = "0.36", features = ["svg"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
pdfium-render = "0.9"
rfd = "0.17"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zstd = "0.13"

[profile.release]
lto = "thin"
strip = true
